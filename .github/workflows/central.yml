name: Maven Central
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify packaging only, or upload a signed deployment for manual Portal publication
        type: choice
        options: [verify, upload]
        default: verify
        required: true
permissions:
  contents: read
concurrency:
  group: maven-central
  cancel-in-progress: false
jobs:
  central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check upload credentials
        if: inputs.operation == 'upload'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - name: Verify Central packaging without uploading
        if: inputs.operation == 'verify'
        run: ./mvnw -B -ntp clean verify -Prelease,central -pl '!examples' -Dgpg.skip=true
      - name: Import signing key
        if: inputs.operation == 'upload'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Check public signing key availability
        if: inputs.operation == 'upload'
        run: |
          fingerprint=$(gpg --batch --with-colons --fingerprint | awk -F: '$1 == "fpr" { print $10; exit }')
          [[ "$fingerprint" =~ ^[A-F0-9]{40}$ ]]
          echo "Signing key fingerprint: $fingerprint"
          curl --fail --silent --show-error --retry 2 \
            "https://keys.openpgp.org/vks/v1/by-fingerprint/$fingerprint" \
            --output "$RUNNER_TEMP/jev-public-key.asc"
          gpg --batch --list-packets "$RUNNER_TEMP/jev-public-key.asc"
      - name: Sign and upload for Portal validation
        if: inputs.operation == 'upload'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp clean deploy -Prelease,central -pl '!examples'
      - name: Record artifact signature metadata
        if: always() && inputs.operation == 'upload'
        run: |
          for signature in jev-core/target/jev-core-*.jar.asc; do
            if test -f "$signature"; then
              gpg --batch --list-packets "$signature"
              break
            fi
          done
      - name: Retain public deployment bundle for validation diagnosis
        if: always() && inputs.operation == 'upload'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-deployment-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: ignore
          retention-days: 7
