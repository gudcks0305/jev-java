name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 4 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    name: Java analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504 # v3
        with:
          languages: java-kotlin
          build-mode: manual
      - run: ./mvnw -B -ntp package -DskipTests
      - uses: github/codeql-action/analyze@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504 # v3
