name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          actual=$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          test "$actual" = "$version"
      - run: ./mvnw -B -ntp clean verify -Prelease
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          ./scripts/package-release.sh "$version"
          notes="docs/releases/$version.md"
          if test -f "$notes"; then
            gh release create "$RELEASE_TAG" dist/release/"$version"/* --verify-tag --title "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" dist/release/"$version"/* --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
