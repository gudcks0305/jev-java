name: Maven Central
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify packaging, upload for manual Portal publication, or publish a released version publicly
        type: choice
        options: [verify, upload, publish]
        default: verify
        required: true
permissions:
  contents: read
concurrency:
  group: maven-central
  cancel-in-progress: false
jobs:
  central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - name: Check public release before publishing
        if: inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" != refs/tags/v* ]]; then
            echo "::error::Publish requires an existing vX.Y.Z release tag"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          actual=$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$actual" != "$version" ]]; then
            echo "::error::Release tag does not match the Maven project version"
            exit 1
          fi
          release_tag=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft --jq 'select(.isDraft == false) | .tagName')
          if [[ "$release_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::Publish requires an existing public GitHub Release for this tag"
            exit 1
          fi
      - name: Check deployment credentials
        if: inputs.operation == 'upload' || inputs.operation == 'publish'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done
      - name: Verify Central packaging without uploading
        if: inputs.operation == 'verify'
        run: ./mvnw -B -ntp clean verify -Prelease,central -pl '!examples' -Dgpg.skip=true
      - name: Import signing key
        if: inputs.operation == 'upload' || inputs.operation == 'publish'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Check public signing key availability
        if: inputs.operation == 'upload' || inputs.operation == 'publish'
        run: |
          fingerprint=$(gpg --batch --with-colons --fingerprint | awk -F: '$1 == "fpr" { print $10; exit }')
          [[ "$fingerprint" =~ ^[A-F0-9]{40}$ ]]
          echo "Signing key fingerprint: $fingerprint"
          curl --fail --silent --show-error --retry 2 \
            "https://keys.openpgp.org/vks/v1/by-fingerprint/$fingerprint" \
            --output "$RUNNER_TEMP/jev-public-key.asc"
          gpg --batch --list-packets "$RUNNER_TEMP/jev-public-key.asc"
      - name: Sign and upload for Portal validation
        if: inputs.operation == 'upload'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp clean deploy -Prelease,central -pl '!examples'
      - name: Sign and publish to Maven Central
        if: inputs.operation == 'publish'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp clean deploy -Prelease,central -pl '!examples' -Dcentral.auto-publish=true -Dcentral.wait-until=published
      - name: Record artifact signature metadata
        if: always() && (inputs.operation == 'upload' || inputs.operation == 'publish')
        run: |
          for signature in jev-core/target/jev-core-*.jar.asc; do
            if test -f "$signature"; then
              gpg --batch --list-packets "$signature"
              break
            fi
          done
      - name: Retain public deployment bundle for validation diagnosis
        if: always() && (inputs.operation == 'upload' || inputs.operation == 'publish')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: central-deployment-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: ignore
          retention-days: 7
