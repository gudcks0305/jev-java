name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          actual=$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          test "$actual" = "$version"
      - run: ./mvnw -B -ntp clean verify -Prelease
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          ./scripts/package-release.sh "$version"
          notes="docs/releases/$version.md"
          if test -f "$notes"; then
            gh release create "$RELEASE_TAG" dist/release/"$version"/* --verify-tag --title "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" dist/release/"$version"/* --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
